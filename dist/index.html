  <style>

<body>
  <main class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">Tu texto · árabe fuṣḥā</p>

        <p class="intro">100 palabras del texto, cada una con cuatro ejemplos en árabe y español.</p>
      </div>
      <div class="count" aria-label="100 palabras"><strong>100</strong><span>palabras</span></div>

    <div class="toolbar">
      <div class="tabs" role="group" aria-label="Filtrar palabras">
        <button type="button" data-filter="all" aria-pressed="true">Todas</button>

        <button type="button" data-filter="noun" aria-pressed="false">Sustantivos</button>
      </div>
      <label class="search"><input id="search" type="search" placeholder="Buscar en árabe o español" aria-label="Buscar en árabe o español"></label>
      <button class="study" id="study" type="button" aria-pressed="false">Ocultar traducciones</button>
    </div>
    <div id="content"></div>
  </main>
  <script>
    const groups = [
      { title: 'Rutina y aprendizaje', kind: 'verb', items: [
        { ar: 'قَضَى / يَقْضِي', es: 'Pasar o dedicar tiempo', examples: [
          ['أَقْضِي سَاعَةً فِي قِرَاءَةِ الْقُرْآنِ.', 'Paso una hora leyendo el Corán.'],
          ['قَضَيْنَا الْعُطْلَةَ مَعَ الْأُسْرَةِ.', 'Pasamos las vacaciones con la familia.'],
          ['لَا تَقْضِ وَقْتَكَ عَلَى الْهَاتِفِ.', 'No pases tu tiempo con el teléfono.'],
          ['قَضَتْ أُخْتِي يَوْمَهَا فِي الدِّرَاسَةِ.', 'Mi hermana pasó el día estudiando.']
        ] },
        { ar: 'فَضَّلَ / يُفَضِّلُ', es: 'Preferir', examples: [
          ['أُفَضِّلُ الْقَهْوَةَ عَلَى الشَّايِ.', 'Prefiero el café al té.'],
          ['تُفَضِّلُ أُخْتِي الْمَشْيَ صَبَاحًا.', 'Mi hermana prefiere pasear por la mañana.'],
          ['هَلْ تُفَضِّلُ أَنْ نَدْرُسَ الْيَوْمَ؟', '¿Prefieres que estudiemos hoy?'],
          ['فَضَّلْنَا السَّفَرَ بِالْقِطَارِ.', 'Preferimos viajar en tren.']
        ] },
        { ar: 'اِهْتَمَّ / يَهْتَمُّ بِـ', es: 'Interesarse por · ocuparse de', examples: [
          ['أَهْتَمُّ بِتَعَلُّمِ الْعَرَبِيَّةِ.', 'Me interesa aprender árabe.'],
          ['يَهْتَمُّ الطَّبِيبُ بِصِحَّةِ مَرْضَاهُ.', 'El médico se ocupa de la salud de sus pacientes.'],
          ['اِهْتَمَمْنَا بِتَنْظِيمِ الْبَيْتِ.', 'Nos ocupamos de organizar la casa.'],
          ['هَلْ تَهْتَمُّ بِهَذَا الْمَوْضُوعِ؟', '¿Te interesa este tema?']
        ] },
        { ar: 'حَفِظَ / يَحْفَظُ', es: 'Memorizar', examples: [
          ['أَحْفَظُ سُورَةً قَصِيرَةً.', 'Memorizo una sura corta.'],
          ['حَفِظَ الطِّفْلُ رَقْمَ هَاتِفِ أُمِّهِ.', 'El niño memorizó el número de su madre.'],
          ['اِحْفَظْ هَذِهِ الْكَلِمَةَ فِي جُمْلَةٍ.', 'Memoriza esta palabra dentro de una frase.'],
          ['نَحْفَظُ الْعُنْوَانَ قَبْلَ السَّفَرِ.', 'Memorizamos la dirección antes de viajar.']
        ] },
        { ar: 'اِسْتَطَاعَ / يَسْتَطِيعُ', es: 'Poder · ser capaz de', examples: [
          ['أَسْتَطِيعُ أَنْ أَفْهَمَ هَذَا الدَّرْسَ.', 'Puedo entender esta lección.'],
          ['لَمْ يَسْتَطِعْ أَبِي السَّفَرَ أَمْسِ.', 'Mi padre no pudo viajar ayer.'],
          ['هَلْ تَسْتَطِيعُ مُسَاعَدَتِي؟', '¿Puedes ayudarme?'],
          ['اِسْتَطَاعَتْ أُخْتِي إِنْهَاءَ الْعَمَلِ.', 'Mi hermana pudo terminar el trabajo.']
        ] }
      ] },
      { title: 'Trabajo, búsqueda y cambios', kind: 'verb', items: [
        { ar: 'تَحَمَّلَ / يَتَحَمَّلُ', es: 'Asumir · soportar', examples: [
          ['أَتَحَمَّلُ مَصَارِيفَ الْبَيْتِ.', 'Asumo los gastos de la casa.'],
          ['تَحَمَّلَتْ أُمِّي الْمَشَقَّةَ بِصَبْرٍ.', 'Mi madre soportó la dificultad con paciencia.'],
          ['لَا يَتَحَمَّلُ هَذَا الْجِسْرُ سَيَّارَاتٍ ثَقِيلَةً.', 'Este puente no soporta vehículos pesados.'],
          ['نَتَحَمَّلُ الْمَسْؤُولِيَّةَ مَعًا.', 'Asumimos la responsabilidad juntos.']
        ] },
        { ar: 'بَحَثَ / يَبْحَثُ عَنْ', es: 'Buscar · investigar', examples: [
          ['أَبْحَثُ عَنْ عَمَلٍ جَدِيدٍ.', 'Busco un trabajo nuevo.'],
          ['بَحَثَتِ الطَّالِبَةُ عَنْ مَعْنَى الْكَلِمَةِ.', 'La estudiante buscó el significado de la palabra.'],
          ['نَبْحَثُ عَنْ حَلٍّ لِلْمُشْكِلَةِ.', 'Buscamos una solución al problema.'],
          ['هَلْ بَحَثْتَ عَنْ مِفْتَاحِكَ؟', '¿Has buscado tu llave?']
        ] },
        { ar: 'بَنَى / يَبْنِي', es: 'Construir', examples: [
          ['أُرِيدُ أَنْ أَبْنِيَ أُسْرَةً مُسْتَقِرَّةً.', 'Quiero construir una familia estable.'],
          ['بَنَى الْعُمَّالُ بَيْتًا جَدِيدًا.', 'Los trabajadores construyeron una casa nueva.'],
          ['تَبْنِي الصَّرَاحَةُ الثِّقَةَ.', 'La sinceridad construye confianza.'],
          ['نَبْنِي خُطَّتَنَا عَلَى الْوَاقِعِ.', 'Basamos nuestro plan en la realidad.']
        ] },
        { ar: 'اِسْتَقَرَّ / يَسْتَقِرُّ', es: 'Establecerse · estabilizarse', examples: [
          ['اِسْتَقْرَرْتُ فِي الْمَدِينَةِ.', 'Me establecí en Medina.'],
          ['اِسْتَقَرَّ السِّعْرُ بَعْدَ ارْتِفَاعِهِ.', 'El precio se estabilizó después de subir.'],
          ['يُرِيدُ أَخِي أَنْ يَسْتَقِرَّ فِي عَمَلِهِ.', 'Mi hermano quiere asentarse en su trabajo.'],
          ['اِسْتَقَرَّتْ أُسْرَتُهُ هُنَا بَعْدَ رِحْلَاتٍ كَثِيرَةٍ.', 'Su familia se estableció aquí después de muchos viajes.']
        ] },
        { ar: 'اِضْطُرَّ / يَضْطَرُّ إِلَى', es: 'Verse obligado a', examples: [
          ['اِضْطُرِرْتُ إِلَى تَغْيِيرِ مَوْعِدِي.', 'Tuve que cambiar mi cita.'],
          ['قَدْ نَضْطَرُّ إِلَى السَّفَرِ غَدًا.', 'Puede que tengamos que viajar mañana.'],
          ['لَا أُرِيدُ أَنْ يَضْطَرَّ أَحَدٌ إِلَى الِانْتِظَارِ.', 'No quiero que nadie tenga que esperar.'],
          ['اِضْطُرَّتِ الشَّرِكَةُ إِلَى تَأْجِيلِ الْمَشْرُوعِ.', 'La empresa tuvo que aplazar el proyecto.']
        ] }
      ] },
      { title: 'Cuidado, cooperación y esfuerzo', kind: 'verb', items: [
        { ar: 'رَعَى / يَرْعَى', es: 'Cuidar de', examples: [
          ['أَرْعَى وَالِدَيَّ عِنْدَ حَاجَتِهِمَا إِلَيَّ.', 'Cuido de mis padres cuando me necesitan.'],
          ['يَرْعَى الْأَبُ أَطْفَالَهُ فِي الْمَنْزِلِ.', 'El padre cuida de sus hijos en casa.'],
          ['رَعَى الطَّبِيبُ الْمَرِيضَ بِاهْتِمَامٍ.', 'El médico atendió al paciente con esmero.'],
          ['تَرْعَى الْمُعَلِّمَةُ الطُّلَّابَ الصِّغَارَ.', 'La maestra cuida de los alumnos pequeños.']
        ] },
        { ar: 'تَعَاوَنَ / يَتَعَاوَنُ', es: 'Cooperar', examples: [
          ['نَتَعَاوَنُ فِي أَعْمَالِ الْبَيْتِ.', 'Cooperamos en las tareas de casa.'],
          ['تَعَاوَنَ الطُّلَّابُ عَلَى حَلِّ الْمَسْأَلَةِ.', 'Los alumnos colaboraron para resolver el ejercicio.'],
          ['تَتَعَاوَنُ الشَّرِكَتَانِ فِي هَذَا الْمَشْرُوعِ.', 'Las dos empresas cooperan en este proyecto.'],
          ['تَعَاوَنْتُ مَعَ زَمِيلِي فِي الْعَمَلِ.', 'Colaboré con mi compañero en el trabajo.']
        ] },
        { ar: 'سَعَى / يَسْعَى', es: 'Esforzarse por · procurar', examples: [

          ['يَسْعَى الشَّابُّ إِلَى عَمَلٍ مُنَاسِبٍ.', 'El joven procura encontrar un trabajo adecuado.'],
          ['سَعَيْنَا لِإِصْلَاحِ الْخِلَافِ.', 'Intentamos resolver el desacuerdo.'],
          ['تَسْعَى إِلَى تَحْقِيقِ هَدَفِهَا.', 'Ella se esfuerza por lograr su objetivo.']
        ] },
        { ar: 'رَزَقَ / يَرْزُقُ', es: 'Conceder sustento o bienes', examples: [

          ['أَسْأَلُ اللهَ أَنْ يَرْزُقَنِي عِلْمًا نَافِعًا.', 'Pido a Allah que me conceda conocimiento beneficioso.'],
          ['رَزَقَنَا اللهُ طَعَامًا طَيِّبًا.', 'Allah nos concedió buena comida.'],
          ['يَرْزُقُ اللهُ مَنْ يَشَاءُ.', 'Allah provee a quien Él quiere.']
        ] }
      ] },
      { title: 'Ideas esenciales', kind: 'noun', items: [
        { ar: 'مَسْؤُولِيَّةٌ', es: 'Responsabilidad', examples: [

        { ar: 'تَرْبِيَةٌ', es: 'Crianza · educación', examples: [

zar","kind":"verb","items":[{"ar":"نَفَعَ / يَنْفَعُ","es":"Beneficiar; ser útil","examples":[["يَنْفَعُنِي هَذَا الدَّرْسُ كَثِيرًا.","Esta lección me beneficia mucho."],["نَفَعَ الدَّوَاءُ الْمَرِيضَ.","El medicamento ayudó al enfermo."],["هَلْ يَنْفَعُكَ هَذَا الْكِتَابُ؟","¿Te resulta útil este libro?"],["لَا يَنْفَعُ الْكَلامُ بِغَيْرِ عَمَلٍ.","Hablar sin actuar no sirve."]]},{"ar":"تَعَلَّمَ / يَتَعَلَّمُ","es":"Aprender","examples":[["أَتَعَلَّمُ كَلِمَاتٍ جَدِيدَةً كُلَّ يَوْمٍ.","Aprendo palabras nuevas cada día."],["تَعَلَّمَتْ أُخْتِي السِّبَاحَةَ.","Mi hermana aprendió a nadar."],["يَتَعَلَّمُ الْأَطْفَالُ بِاللَّعِبِ.","Los niños aprenden jugando."],["مَاذَا تَعَلَّمْتَ مِنْ هَذِهِ التَّجْرِبَةِ؟","¿Qué aprendiste de esta experiencia?"]]},{"ar":"اِسْتَفَادَ / يَسْتَفِيدُ مِنْ","es":"Beneficiarse de","examples":[["أَسْتَفِيدُ مِنْ نَصِيحَةِ أَبِي.","Me beneficio del consejo de mi padre."],["اِسْتَفَدْنَا مِنَ الدَّرْسِ.","Sacamos provecho de la lección."],["كَيْفَ تَسْتَفِيدُ مِنْ وَقْتِ فَرَاغِكَ؟","¿Cómo aprovechas tu tiempo libre?"],["يَسْتَفِيدُ الطُّلَّابُ مِنَ الْمَكْتَبَةِ.","Los estudiantes se benefician de la biblioteca."]]},{"ar":"اِسْتَيْقَظَ / يَسْتَيْقِظُ","es":"Despertarse","examples":[["أَسْتَيْقِظُ قَبْلَ الْفَجْرِ.","Me despierto antes del alba."],["اِسْتَيْقَظَ الْأَطْفَالُ مُبَكِّرًا.","Los niños se despertaron temprano."],["مَتَى تَسْتَيْقِظُ يَوْمَ الْجُمُعَةِ؟","¿A qué hora te despiertas el viernes?"],["لَمْ تَسْتَيْقِظْ أُخْتِي مِنَ النَّوْمِ بَعْدُ.","Mi hermana todavía no se ha despertado."]]},{"ar":"بَدَأَ / يَبْدَأُ","es":"Empezar","examples":[["أَبْدَأُ عَمَلِي فِي الصَّبَاحِ.","Empiezo a trabajar por la mañana."],["بَدَأَ الْمَطَرُ بَعْدَ الظُّهْرِ.","La lluvia empezó después del mediodía."],["مَتَى يَبْدَأُ الدَّرْسُ؟","¿Cuándo empieza la clase?"],["بَدَأْنَا قِرَاءَةَ الْكِتَابِ مَعًا.","Empezamos a leer el libro juntos."]]},{"ar":"اِسْتَمَرَّ / يَسْتَمِرُّ","es":"Continuar","examples":[["أَسْتَمِرُّ فِي دِرَاسَةِ الْعَرَبِيَّةِ.","Continúo estudiando árabe."],["اِسْتَمَرَّ الْمَطَرُ سَاعَتَيْنِ.","La lluvia continuó durante dos horas."],["سَيَسْتَمِرُّ الْعَمَلُ غَدًا.","El trabajo continuará mañana."],["هَلْ تَسْتَمِرُّ فِي هَذِهِ الْخُطَّةِ؟","¿Continuarás con este plan?"]]},{"ar":"خَصَّصَ / يُخَصِّصُ","es":"Reservar; dedicar","examples":[["أُخَصِّصُ سَاعَةً لِلْقِرَاءَةِ.","Dedico una hora a la lectura."],["خَصَّصَتِ الْمَدْرَسَةُ غُرْفَةً لِلْمَكْتَبَةِ.","La escuela reservó una sala para la biblioteca."],["كَمْ وَقْتًا تُخَصِّصُ لِلرِّيَاضَةِ؟","¿Cuánto tiempo dedicas al deporte?"],["خَصَّصْنَا جُزْءًا مِنَ الْمَالِ لِلطَّوَارِئِ.","Reservamos parte del dinero para emergencias."]]},{"ar":"تَعَوَّدَ / يَتَعَوَّدُ عَلَى","es":"Acostumbrarse a","examples":[["تَعَوَّدْتُ عَلَى الِاسْتِيقَاظِ مُبَكِّرًا.","Me acostumbré a despertarme temprano."],["يَتَعَوَّدُ الطِّفْلُ عَلَى النِّظَامِ.","El niño se acostumbra a la rutina."],["هَلْ تَعَوَّدْتَ عَلَى الطَّقْسِ هُنَا؟","¿Te has acostumbrado al clima de aquí?"],["لَمْ نَتَعَوَّدْ عَلَى الطَّعَامِ الْجَدِيدِ بَعْدُ.","Todavía no nos acostumbramos a la comida nueva."]]},{"ar":"اِسْتَقَلَّ / يَسْتَقِلُّ عَنْ","es":"Independizarse de","examples":[["اِسْتَقْلَلْتُ عَنْ وَالِدَيَّ بَعْدَ الدِّرَاسَةِ.","Me independicé de mis padres después de estudiar."],["يُرِيدُ أَخِي أَنْ يَسْتَقِلَّ مَادِّيًّا.","Mi hermano quiere independizarse económicamente."],["اِسْتَقَلَّتِ الشَّرِكَةُ عَنِ الْمَجْمُوعَةِ.","La empresa se independizó del grupo."],["مَتَى اِسْتَقْلَلْتَ فِي السَّكَنِ؟","¿Cuándo empezaste a vivir de forma independiente?"]]},{"ar":"كَسَبَ / يَكْسِبُ","es":"Ganar; obtener","examples":[["أَكْسِبُ رِزْقِي مِنْ عَمَلِي.","Me gano la vida con mi trabajo."],["كَسَبَ الْفَرِيقُ الْمُبَارَاةَ.","El equipo ganó el partido."],["يَكْسِبُ الثِّقَةَ بِصِدْقِهِ.","Se gana la confianza con su sinceridad."],["مَاذَا كَسَبْتَ مِنْ هَذِهِ التَّجْرِبَةِ؟","¿Qué obtuviste de esta experiencia?"]]}]},{"title":"Ideas y decisiones","kind":"verb","items":[{"ar":"أَدَارَ / يُدِيرُ","es":"Gestionar; dirigir","examples":[["أُدِيرُ أُمُورِي بِنَفْسِي.","Gestiono mis asuntos por mí mismo."],["يُدِيرُ أَخِي شَرِكَةً صَغِيرَةً.","Mi hermano dirige una pequeña empresa."],["أَدَارَتِ الْمُعَلِّمَةُ النِّقَاشَ بِهُدُوءٍ.","La profesora dirigió el debate con calma."],["مَنْ يُدِيرُ هَذَا الْمَشْرُوعَ؟","¿Quién gestiona este proyecto?"]]},{"ar":"وَجَدَ / يَجِدُ","es":"Encontrar","examples":[["وَجَدْتُ كِتَابِي فِي الْغُرْفَةِ.","Encontré mi libro en la habitación."],["لَمْ يَجِدْ عَمَلًا بَعْدُ.","Todavía no ha encontrado trabajo."],["هَلْ وَجَدْتَ الْجَوَابَ؟","¿Encontraste la respuesta?"],["نَجِدُ فِي هَذَا الدَّرْسِ كَلِمَاتٍ مُفِيدَةً.","Encontramos palabras útiles en esta lección."]]},{"ar":"أَقْنَعَ / يُقْنِعُ","es":"Convencer","examples":[["أَقْنَعَنِي كَلَامُهُ.","Sus palabras me convencieron."],["لَمْ تُقْنِعْنِي هَذِهِ الْحُجَّةُ.","Este argumento no me convenció."],["يُحَاوِلُ أَنْ يُقْنِعَ صَدِيقَهُ بِالْفِكْرَةِ.","Intenta convencer a su amigo de la idea."],["مَا الَّذِي أَقْنَعَكَ بِهَذَا الْقَرَارِ؟","¿Qué te convenció de tomar esta decisión?"]]},{"ar":"رَجَعَ / يَرْجِعُ","es":"Regresar","examples":[["رَجَعْتُ إِلَى الْبَيْتِ بَعْدَ الْعَمَلِ.","Regresé a casa después del trabajo."],["سَيَرْجِعُ أَبِي غَدًا.","Mi padre volverá mañana."],["هَلْ رَجَعْتُمْ مِنَ السَّفَرِ؟","¿Habéis vuelto del viaje?"],["نَرْجِعُ إِلَى هَذِهِ النُّقْطَةِ لَاحِقًا.","Volveremos a este punto más tarde."]]},{"ar":"حَكَى / يَحْكِي","es":"Contar; narrar","examples":[["حَكَيْتُ لِأُمِّي عَنْ يَوْمِي.","Le conté a mi madre cómo fue mi día."],["يَحْكِي الْجَدُّ قِصَّةً لِلْأَطْفَالِ.","El abuelo cuenta un cuento a los niños."],["هَلْ تَحْكِي لِي مَا حَدَثَ؟","¿Me cuentas lo que pasó?"],["حَكَتْ صَدِيقَتِي عَنْ رِحْلَتِهَا.","Mi amiga habló de su viaje."]]},{"ar":"مَرَّ / يَمُرُّ بِـ","es":"Pasar por; experimentar","examples":[["مَرَرْتُ بِالسُّوقِ فِي طَرِيقِي.","Pasé por el mercado de camino."],["يَمُرُّ صَدِيقِي بِوَقْتٍ صَعْبٍ.","Mi amigo atraviesa un momento difícil."],["مَرَّتْ سَنَةٌ بِسُرْعَةٍ.","Pasó un año rápidamente."],["بِمَاذَا مَرَرْتَ خِلَالَ السَّفَرِ؟","¿Qué viviste durante el viaje?"]]},{"ar":"آمَنَ / يُؤْمِنُ بِـ","es":"Creer en","examples":[["أُؤْمِنُ بِأَهَمِّيَّةِ الصِّدْقِ.","Creo en la importancia de la sinceridad."],["آمَنَ بِهَذِهِ الْفِكْرَةِ مُنْذُ صِغَرِهِ.","Cree en esta idea desde pequeño."],["هَلْ تُؤْمِنُ بِقُدْرَتِكَ عَلَى التَّعَلُّمِ؟","¿Crees en tu capacidad de aprender?"],["آمَنَّا بِأَنَّ الْعَمَلَ يُغَيِّرُ الْحَيَاةَ.","Creímos que el trabajo cambia la vida."]]},{"ar":"أَثَّرَ / يُؤَثِّرُ فِي","es":"Influir en; afectar","examples":[["أَثَّرَتْ فِيَّ هَذِهِ الْقِصَّةُ.","Esta historia me conmovió."],["يُؤَثِّرُ النَّوْمُ فِي الصِّحَّةِ.","El sueño influye en la salud."],["هَلْ أَثَّرَ السَّفَرُ فِي قَرَارِكَ؟","¿Influyó el viaje en tu decisión?"],["تُؤَثِّرُ الْكَلِمَاتُ الطَّيِّبَةُ فِي النَّاسِ.","Las buenas palabras influyen en las personas."]]},{"ar":"وَصَفَ / يَصِفُ","es":"Describir","examples":[["وَصَفْتُ لِصَدِيقِي الطَّرِيقَ.","Describí el camino a mi amigo."],["يَصِفُ الْمَرِيضُ الْأَلَمَ بِدِقَّةٍ.","El paciente describe el dolor con precisión."],["هَلْ تَسْتَطِيعُ أَنْ تَصِفَ بَيْتَكَ؟","¿Puedes describir tu casa?"],["وَصَفَتِ الطِّفْلَةُ مَا رَأَتْهُ.","La niña describió lo que vio."]]},{"ar":"قَرَّرَ / يُقَرِّرُ","es":"Decidir","examples":[["قَرَّرْتُ أَنْ أَتَعَلَّمَ الْعَرَبِيَّةَ.","Decidí aprender árabe."],["يُقَرِّرُ أَخِي بَعْدَ التَّفْكِيرِ.","Mi hermano decide después de pensar."],["هَلْ قَرَّرْتُمْ مَتَى تَسَافِرُونَ؟","¿Habéis decidido cuándo viajaréis?"],["قَرَّرَتِ الْمَدْرَسَةُ تَغْيِيرَ الْجَدْوَلِ.","La escuela decidió cambiar el horario."]]}]},{"title":"Actuar y mejorar","kind":"verb","items":[{"ar":"نَطَقَ / يَنْطِقُ بِـ","es":"Pronunciar","examples":[["نَطَقْتُ بِالْكَلِمَةِ بِوُضُوحٍ.","Pronuncié la palabra con claridad."],["يَنْطِقُ الطِّفْلُ اسْمَهُ لِأَوَّلِ مَرَّةٍ.","El niño pronuncia su nombre por primera vez."],["هَلْ تَعْرِفُ كَيْفَ تَنْطِقُ هَذَا الْحَرْفَ؟","¿Sabes cómo pronunciar esta letra?"],["نَطَقَ بِالشَّهَادَةِ أَمَامَ أَصْدِقَائِهِ.","Pronunció la shahada ante sus amigos."]]},{"ar":"تَيَسَّرَ / يَتَيَسَّرُ","es":"Resultar posible; facilitarse","examples":[["تَيَسَّرَ لِي حُضُورُ الدَّرْسِ.","Me fue posible asistir a la clase."],["إِذَا تَيَسَّرَ الْأَمْرُ فَسَنَسَافِرُ.","Si resulta posible, viajaremos."],["لَمْ يَتَيَسَّرْ لَنَا الْوَقْتُ أَمْسِ.","Ayer no encontramos el tiempo necesario."],["مَتَى يَتَيَسَّرُ لَكَ اللِّقَاءُ؟","¿Cuándo te vendrá bien reunirnos?"]]},{"ar":"أَنْفَقَ / يُنْفِقُ","es":"Gastar","examples":[["أُنْفِقُ الْمَالَ عَلَى مَا يَنْفَعُنِي.","Gasto dinero en lo que me beneficia."],["أَنْفَقَتِ الْأُسْرَةُ كَثِيرًا عَلَى السَّفَرِ.","La familia gastó mucho en el viaje."],["كَمْ تُنْفِقُ كُلَّ شَهْرٍ عَلَى الطَّعَامِ؟","¿Cuánto gastas al mes en comida?"],["لَا تُنْفِقْ كُلَّ مَا مَعَكَ.","No gastes todo lo que tienes."]]},{"ar":"اِدَّخَرَ / يَدَّخِرُ","es":"Ahorrar","examples":[["أَدَّخِرُ جُزْءًا مِنْ دَخْلِي.","Ahorro parte de mis ingresos."],["اِدَّخَرْنَا مَالًا لِلسَّفَرِ.","Ahorramos dinero para viajar."],["هَلْ تَدَّخِرُ لِلطَّوَارِئِ؟","¿Ahorras para emergencias?"],["تَدَّخِرُ أُخْتِي وَقْتَهَا بِالتَّنْظِيمِ.","Mi hermana ahorra tiempo organizándose."]]},{"ar":"حَاوَلَ / يُحَاوِلُ","es":"Intentar","examples":[["أُحَاوِلُ أَنْ أَفْهَمَ السُّؤَالَ.","Intento entender la pregunta."],["حَاوَلَ أَبِي إِصْلَاحَ السَّيَّارَةِ.","Mi padre intentó reparar el coche."],["هَلْ حَاوَلْتَ التَّحَدُّثَ بِالْعَرَبِيَّةِ؟","¿Has intentado hablar en árabe?"],["سَنُحَاوِلُ مَرَّةً أُخْرَى.","Lo intentaremos otra vez."]]},{"ar":"سَمَحَ / يَسْمَحُ لِـ","es":"Permitir","examples":[["يَسْمَحُ لِي عَمَلِي بِالسَّفَرِ.","Mi trabajo me permite viajar."],["سَمَحَ الْمُعَلِّمُ لِلطُّلَّابِ بِالسُّؤَالِ.","El profesor permitió a los alumnos preguntar."],["هَلْ تَسْمَحُ لِي بِالدُّخُولِ؟","¿Me permites entrar?"],["لَمْ يَسْمَحِ الْوَقْتُ بِزِيَارَةِ الْمَتْحَفِ.","El tiempo no permitió visitar el museo."]]},{"ar":"أَعَانَ / يُعِينُ عَلَى","es":"Ayudar a","examples":[["يُعِينُنِي أَخِي عَلَى الدِّرَاسَةِ.","Mi hermano me ayuda a estudiar."],["أَعَانَتْنِي أُمِّي عَلَى اتِّخَاذِ الْقَرَارِ.","Mi madre me ayudó a tomar la decisión."],["هَذَا الْكِتَابُ يُعِينُ عَلَى الْفَهْمِ.","Este libro ayuda a comprender."],["نُعِينُ بَعْضَنَا عَلَى الْخَيْرِ.","Nos ayudamos unos a otros a hacer el bien."]]},{"ar":"رَبَّى / يُرَبِّي","es":"Criar; educar","examples":[["نُرَبِّي أَبْنَاءَنَا عَلَى الصِّدْقِ.","Educamos a nuestros hijos en la sinceridad."],["رَبَّى الْأَبُ ابْنَهُ بِصَبْرٍ.","El padre crió a su hijo con paciencia."],["تُرَبِّي أُخْتِي قِطَّةً صَغِيرَةً.","Mi hermana cría una gatita."],["كَيْفَ نُرَبِّي الطِّفْلَ عَلَى الْقِرَاءَةِ؟","¿Cómo educamos al niño en la lectura?"]]},{"ar":"شَجَّعَ / يُشَجِّعُ","es":"Animar; alentar","examples":[["يُشَجِّعُنِي صَدِيقِي عَلَى التَّعَلُّمِ.","Mi amigo me anima a aprender."],["شَجَّعَ الْمُعَلِّمُ الطِّفْلَ عَلَى الْقِرَاءَةِ.","El profesor animó al niño a leer."],["هَلْ تُشَجِّعُ فَرِيقًا رِيَاضِيًّا؟","¿Apoyas a algún equipo deportivo?"],["شَجَّعْنَا أُخْتَنَا قَبْلَ الِامْتِحَانِ.","Animamos a nuestra hermana antes del examen."]]},{"ar":"تَحَسَّنَ / يَتَحَسَّنُ","es":"Mejorar","examples":[["تَحَسَّنَتْ عَرَبِيَّتِي بِالْمُمَارَسَةِ.","Mi árabe mejoró con la práctica."],["تَتَحَسَّنُ صِحَّةُ أَبِي يَوْمًا بَعْدَ يَوْمٍ.","La salud de mi padre mejora día tras día."],["هَلْ تَحَسَّنَ عَمَلُكَ هَذَا الشَّهْرَ؟","¿Ha mejorado tu trabajo este mes?"],["سَتَتَحَسَّنُ عَلاقَتُنَا بِالصَّرَاحَةِ.","Nuestra relación mejorará con sinceridad."]]}]},{"title":"Vida cotidiana","kind":"noun","items":[{"ar":"مَجَالٌ","es":"Campo; ámbito","examples":[["أَعْمَلُ فِي مَجَالِ الْبَرْمَجَةِ.","Trabajo en el campo de la programación."],["هَذَا الْمَوْضُوعُ خَارِجَ مَجَالِ خِبْرَتِي.","Este tema queda fuera de mi campo de experiencia."],["فِي أَيِّ مَجَالٍ تُرِيدُ أَنْ تَعْمَلَ؟","¿En qué sector quieres trabajar?"],["لِلرِّيَاضَةِ مَجَالٌ وَاسِعٌ فِي حَيَاتِهِ.","El deporte ocupa un lugar importante en su vida."]]},{"ar":"أُمْنِيَّةٌ","es":"Deseo","examples":[["أُمْنِيَّتِي أَنْ أَتَعَلَّمَ الْعَرَبِيَّةَ.","Mi deseo es aprender árabe."],["حَقَّقَتْ أُخْتِي أُمْنِيَّةً قَدِيمَةً.","Mi hermana cumplió un antiguo deseo."],["مَا أَكْبَرُ أُمْنِيَّاتِكَ؟","¿Cuál es tu mayor deseo?"],["بَقِيَتْ هَذِهِ الْأُمْنِيَّةُ فِي قَلْبِهِ سَنَوَاتٍ.","Este deseo permaneció en su corazón durante años."]]},{"ar":"شَخْصِيَّةٌ","es":"Personalidad","examples":[["شَخْصِيَّتُهُ هَادِئَةٌ وَبَسِيطَةٌ.","Su personalidad es tranquila y sencilla."],["تَتَغَيَّرُ شَخْصِيَّةُ الْإِنْسَانِ مَعَ الْخِبْرَةِ.","La personalidad cambia con la experiencia."],["أُحِبُّ شَخْصِيَّتَهَا الصَّرِيحَةَ.","Me gusta su personalidad franca."],["هَلْ تَعْرِفُ شَخْصِيَّةَ زَمِيلِكَ جَيِّدًا؟","¿Conoces bien la personalidad de tu compañero?"]]},{"ar":"هُدُوءٌ","es":"Tranquilidad; calma","examples":[["أَحْتَاجُ إِلَى الْهُدُوءِ عِنْدَ الدِّرَاسَةِ.","Necesito tranquilidad al estudiar."],["أَعْجَبَنِي هُدُوءُ الْبَحْرِ صَبَاحًا.","Me gustó la calma del mar por la mañana."],["تَحَدَّثَ الْمُعَلِّمُ بِهُدُوءٍ.","El profesor habló con calma."],["يَسُودُ الْهُدُوءُ فِي الْبَيْتِ لَيْلًا.","Por la noche reina la tranquilidad en casa."]]},{"ar":"مَظْهَرٌ / مَظَاهِرُ","es":"Apariencia; apariencias","examples":[["لَا أَحْكُمُ عَلَى النَّاسِ مِنْ مَظْهَرِهِمْ.","No juzgo a las personas por su apariencia."],["تَغَيَّرَ مَظْهَرُ الْمَدِينَةِ بَعْدَ الْمَطَرِ.","El aspecto de la ciudad cambió después de la lluvia."],["بَعْضُ الْمَظَاهِرِ لَا تُخْبِرُنَا بِالْحَقِيقَةِ.","Algunas apariencias no nos revelan la verdad."],["يُحِبُّ الْبَسَاطَةَ أَكْثَرَ مِنَ الْمَظَاهِرِ.","Prefiere la sencillez a las apariencias."]]},{"ar":"وَسِيلَةٌ / وَسَائِلُ","es":"Medio; herramienta","examples":[["الْهَاتِفُ وَسِيلَةٌ لِلتَّوَاصُلِ.","El teléfono es un medio de comunicación."],["تَعَلُّمُ اللُّغَةِ وَسِيلَةٌ لِفَهْمِ الثَّقَافَةِ.","Aprender el idioma es un medio para entender la cultura."],["مَا أَفْضَلُ وَسِيلَةٍ لِلذَّهَابِ إِلَى الْمَدْرَسَةِ؟","¿Cuál es el mejor medio para ir a la escuela?"],["تَتَغَيَّرُ وَسَائِلُ التَّعَلُّمِ مَعَ الزَّمَنِ.","Los medios de aprendizaje cambian con el tiempo."]]},{"ar":"فَائِدَةٌ","es":"Beneficio; utilidad","examples":[["لِهَذَا الْكِتَابِ فَائِدَةٌ كَبِيرَةٌ.","Este libro tiene un gran beneficio."],["لَا فَائِدَةَ مِنَ النِّقَاشِ بِغَيْرِ اِحْتِرَامٍ.","Una discusión sin respeto no sirve de nada."],["مَا فَائِدَةُ هَذَا التَّمْرِينِ؟","¿Para qué sirve este ejercicio?"],["وَجَدْتُ فَوَائِدَ كَثِيرَةً فِي الدَّرْسِ.","Encontré muchos beneficios en la lección."]]},{"ar":"شَاشَةٌ","es":"Pantalla","examples":[["أُغْلِقُ الشَّاشَةَ قَبْلَ النَّوْمِ.","Apago la pantalla antes de dormir."],["هَذِهِ الشَّاشَةُ صَغِيرَةٌ لِلْقِرَاءَةِ.","Esta pantalla es pequeña para leer."],["يَجْلِسُ الطِّفْلُ بَعِيدًا عَنِ الشَّاشَةِ.","El niño se sienta lejos de la pantalla."],["تُوجَدُ شَاشَاتٌ كَثِيرَةٌ فِي الْمَكْتَبِ.","Hay muchas pantallas en la oficina."]]},{"ar":"فَتْرَةٌ","es":"Período; etapa","examples":[["هَذِهِ فَتْرَةٌ مُهِمَّةٌ فِي حَيَاتِي.","Esta es una etapa importante de mi vida."],["دَرَسْتُ فَتْرَةً قَصِيرَةً فِي مَدِينَةٍ أُخْرَى.","Estudié una temporada corta en otra ciudad."],["كَمْ تَسْتَمِرُّ فَتْرَةُ الِامْتِحَانَاتِ؟","¿Cuánto dura el período de exámenes?"],["بَعْدَ فَتْرَةٍ مِنَ الرَّاحَةِ عُدْنَا إِلَى الْعَمَلِ.","Tras un período de descanso volvimos al trabajo."]]},{"ar":"فَرَاغٌ","es":"Tiempo libre; vacío","examples":[["أَقْرَأُ فِي وَقْتِ فَرَاغِي.","Leo en mi tiempo libre."],["هَلْ لَدَيْكَ فَرَاغٌ هَذَا الْمَسَاءَ؟","¿Tienes tiempo libre esta tarde?"],["شَعَرَ بِفَرَاغٍ بَعْدَ اِنْتِهَاءِ الدِّرَاسَةِ.","Sintió un vacío al terminar los estudios."],["أُخَصِّصُ بَعْضَ فَرَاغِي لِلرِّيَاضَةِ.","Dedico parte de mi tiempo libre al deporte."]]}]},{"title":"Conocimiento y valores","kind":"noun","items":[{"ar":"عَالِمٌ / عُلَمَاءُ","es":"Sabio; estudioso","examples":[["اِسْتَمَعْتُ إِلَى دَرْسِ عَالِمٍ.","Escuché la lección de un sabio."],["يَسْأَلُ الطَّالِبُ الْعُلَمَاءَ عَمَّا لَا يَفْهَمُهُ.","El estudiante pregunta a los sabios lo que no entiende."],["كَتَبَ هَذَا الْعَالِمُ كُتُبًا مُفِيدَةً.","Este erudito escribió libros útiles."],["لَا يَصِيرُ الْإِنْسَانُ عَالِمًا فِي يَوْمٍ وَاحِدٍ.","Uno no se convierte en sabio en un solo día."]]},{"ar":"رُوتِينٌ","es":"Rutina","examples":[["رُوتِينِي الصَّبَاحِيُّ بَسِيطٌ.","Mi rutina matinal es sencilla."],["تَغَيَّرَ رُوتِينُنَا بَعْدَ السَّفَرِ.","Nuestra rutina cambió después del viaje."],["هَلْ لَدَيْكَ رُوتِينٌ لِلدِّرَاسَةِ؟","¿Tienes una rutina para estudiar?"],["يُسَاعِدُنِي الرُّوتِينُ عَلَى تَنْظِيمِ وَقْتِي.","La rutina me ayuda a organizar mi tiempo."]]},{"ar":"عُطْلَةٌ","es":"Vacaciones; día libre","examples":[["سَأَزُورُ أَهْلِي فِي الْعُطْلَةِ.","Visitaré a mi familia en vacaciones."],["كَانَتِ الْعُطْلَةُ قَصِيرَةً.","Las vacaciones fueron cortas."],["مَتَى تَبْدَأُ عُطْلَةُ نِهَايَةِ الْأُسْبُوعِ؟","¿Cuándo empieza el fin de semana?"],["أُحِبُّ أَنْ أَقْرَأَ فِي أَيَّامِ الْعُطْلَةِ.","Me gusta leer en los días libres."]]},{"ar":"عِلْمٌ","es":"Conocimiento; saber","examples":[["أَطْلُبُ الْعِلْمَ كُلَّ يَوْمٍ.","Busco conocimiento cada día."],["لَا عِلْمَ لِي بِهَذَا الْمَوْضُوعِ.","No tengo conocimiento de este tema."],["يَنْفَعُ الْعِلْمُ صَاحِبَهُ إِذَا عَمِلَ بِهِ.","El conocimiento beneficia a quien lo pone en práctica."],["مَا الْعِلْمُ الَّذِي تُرِيدُ دِرَاسَتَهُ؟","¿Qué disciplina quieres estudiar?"]]},{"ar":"اِسْتِقْلَالٌ","es":"Independencia","examples":[["الِاسْتِقْلَالُ الْمَادِّيُّ يَحْتَاجُ إِلَى خُطَّةٍ.","La independencia económica requiere un plan."],["تَعَلَّمْتُ الِاسْتِقْلَالَ مُبَكِّرًا.","Aprendí a ser independiente pronto."],["هَلْ يَعْنِي الِاسْتِقْلَالُ أَنْ نَعِيشَ وَحْدَنَا؟","¿Significa la independencia vivir solos?"],["يُسَاعِدُ الْعَمَلُ عَلَى الِاسْتِقْلَالِ.","Trabajar ayuda a alcanzar la independencia."]]},{"ar":"رِزْقٌ","es":"Sustento; provisión","examples":[["أَكْسِبُ رِزْقِي بِعَمَلِي.","Me gano el sustento con mi trabajo."],["نَشْكُرُ اللهَ عَلَى الرِّزْقِ.","Agradecemos a Allah el sustento."],["يَطْلُبُ الشَّابُّ رِزْقًا حَلَالًا.","El joven busca un sustento lícito."],["الرِّزْقُ لَيْسَ مَالًا فَقَطْ.","El sustento no consiste solo en dinero."]]},{"ar":"نِعْمَةٌ","es":"Bendición; don","examples":[["الصِّحَّةُ نِعْمَةٌ عَظِيمَةٌ.","La salud es una gran bendición."],["شَكَرْتُ اللهَ عَلَى هَذِهِ النِّعْمَةِ.","Agradecí a Allah esta bendición."],["مَا النِّعَمُ الَّتِي تَرَاهَا فِي حَيَاتِكَ؟","¿Qué bendiciones reconoces en tu vida?"],["وَقْتُ الْفَرَاغِ نِعْمَةٌ إِذَا أَحْسَنَّا اِسْتِعْمَالَهُ.","El tiempo libre es un don si lo aprovechamos bien."]]},{"ar":"ثَقَافَةٌ","es":"Cultura","examples":[["تَعَرَّفْتُ عَلَى ثَقَافَةٍ جَدِيدَةٍ.","Conocí una cultura nueva."],["تَخْتَلِفُ الثَّقَافَاتُ بَيْنَ الْبُلْدَانِ.","Las culturas difieren entre países."],["هَلْ تُحِبُّ دِرَاسَةَ الثَّقَافَةِ الْعَرَبِيَّةِ؟","¿Te gusta estudiar la cultura árabe?"],["الطَّعَامُ جُزْءٌ مِنْ ثَقَافَةِ الشَّعْبِ.","La comida forma parte de la cultura de un pueblo."]]},{"ar":"فَلْسَفَةٌ","es":"Filosofía","examples":[["قَرَأْتُ كِتَابًا فِي الْفَلْسَفَةِ.","Leí un libro de filosofía."],["تَدْرُسُ أُخْتِي فَلْسَفَةَ الْأَخْلَاقِ.","Mi hermana estudia filosofía moral."],["لَهُ فَلْسَفَةٌ خَاصَّةٌ فِي الْحَيَاةِ.","Tiene una filosofía de vida propia."],["تَخْتَلِفُ الْفَلْسَفَاتُ فِي بَعْضِ الْأَسْئِلَةِ.","Las filosofías difieren en algunas preguntas."]]},{"ar":"حَقِيقَةٌ","es":"Verdad; realidad","examples":[["أَبْحَثُ عَنِ الْحَقِيقَةِ.","Busco la verdad."],["قَالَ الْحَقِيقَةَ بِصَرَاحَةٍ.","Dijo la verdad con franqueza."],["هَلْ تَعْرِفُ حَقِيقَةَ مَا حَدَثَ؟","¿Sabes qué pasó realmente?"],["الْحَقِيقَةُ أَحْيَانًا أَصْعَبُ مِنَ التَّوَقُّعَاتِ.","A veces la realidad es más difícil que las expectativas."]]}]},{"title":"Pensamientos y vida práctica","kind":"noun","items":[{"ar":"قِيمَةٌ","es":"Valor; principio apreciado","examples":[["الصِّدْقُ قِيمَةٌ مُهِمَّةٌ لِي.","La sinceridad es un valor importante para mí."],["تَعَلَّمْتُ قِيَمًا كَثِيرَةً مِنْ أُسْرَتِي.","Aprendí muchos valores de mi familia."],["مَا قِيمَةُ الْوَقْتِ عِنْدَكَ؟","¿Qué valor tiene el tiempo para ti?"],["تَظْهَرُ قِيَمُهُ فِي أَفْعَالِهِ.","Sus valores se ven en sus actos."]]},{"ar":"مَبْدَأٌ","es":"Principio","examples":[["هَذَا مَبْدَأٌ لَا أَتْرُكُهُ.","Este es un principio al que no renuncio."],["اِتَّفَقْنَا عَلَى مَبْدَأِ التَّعَاوُنِ.","Acordamos el principio de cooperación."],["مَا الْمَبَادِئُ الَّتِي تُوَجِّهُ حَيَاتَكَ؟","¿Qué principios guían tu vida?"],["تَغَيَّرَ رَأْيُهُ وَلَكِنْ بَقِيَ مَبْدَؤُهُ.","Cambió su opinión, pero mantuvo su principio."]]},{"ar":"شُعُورٌ","es":"Sentimiento; sensación","examples":[["كَانَ شُعُورًا جَمِيلًا.","Fue una sensación hermosa."],["لَا أَسْتَطِيعُ وَصْفَ هَذَا الشُّعُورِ.","No puedo describir este sentimiento."],["مَا شُعُورُكَ بَعْدَ الِامْتِحَانِ؟","¿Cómo te sientes después del examen?"],["تَغَيَّرَ شُعُورُهَا بَعْدَ الْحَدِيثِ.","Su sensación cambió después de hablar."]]},{"ar":"قَلْبٌ","es":"Corazón","examples":[["شَعَرْتُ بِالرَّاحَةِ فِي قَلْبِي.","Sentí tranquilidad en el corazón."],["نَبَضَ قَلْبُهُ بِسُرْعَةٍ.","Su corazón latió deprisa."],["لَهَا قَلْبٌ طَيِّبٌ.","Ella tiene buen corazón."],["مَا زَالَتْ هَذِهِ الذِّكْرَى فِي قَلْبِهِ.","Ese recuerdo sigue en su corazón."]]},{"ar":"عَقْلٌ","es":"Mente; razón","examples":[["أَحْتَاجُ إِلَى عَقْلٍ هَادِئٍ لِلتَّفْكِيرِ.","Necesito la mente tranquila para pensar."],["اِسْتَعْمِلْ عَقْلَكَ قَبْلَ اتِّخَاذِ الْقَرَارِ.","Usa la razón antes de decidir."],["تَبْقَى هَذِهِ الْقِصَّةُ فِي عَقْلِي.","Esta historia permanece en mi mente."],["يَفْهَمُ الْعَقْلُ الْمَعْنَى بِالتَّعَلُّمِ.","La mente comprende el significado mediante el aprendizaje."]]},{"ar":"مَعْنًى","es":"Significado","examples":[["مَا مَعْنَى هَذِهِ الْكَلِمَةِ؟","¿Qué significa esta palabra?"],["لِلْحَيَاةِ مَعْنًى عِنْدَ كُلِّ إِنْسَانٍ.","La vida tiene un significado para cada persona."],["فَهِمْتُ مَعْنَى الْجُمْلَةِ بَعْدَ الشَّرْحِ.","Comprendí el significado de la frase después de la explicación."],["تَتَغَيَّرُ مَعَانِي الْكَلِمَاتِ بِحَسَبِ السِّيَاقِ.","Los significados de las palabras cambian según el contexto."]]},{"ar":"دَخْلٌ","es":"Ingresos","examples":[["لَدَيَّ دَخْلٌ مُنْتَظَمٌ.","Tengo ingresos regulares."],["زَادَ دَخْلُهَا بَعْدَ تَغْيِيرِ عَمَلِهَا.","Sus ingresos aumentaron después de cambiar de trabajo."],["هَلْ يَكْفِي دَخْلُكَ لِمَصَارِيفِ الْبَيْتِ؟","¿Te alcanzan los ingresos para los gastos de la casa?"],["نُخَصِّصُ جُزْءًا مِنَ الدَّخْلِ لِلِادِّخَارِ.","Reservamos parte de los ingresos para ahorrar."]]},{"ar":"سَكَنٌ","es":"Vivienda; alojamiento","examples":[["أَبْحَثُ عَنْ سَكَنٍ قَرِيبٍ مِنَ الْعَمَلِ.","Busco una vivienda cerca del trabajo."],["تَزِيدُ تَكْلِفَةُ السَّكَنِ فِي هَذِهِ الْمَدِينَةِ.","El coste de la vivienda aumenta en esta ciudad."],["وَجَدَ الطَّالِبُ سَكَنًا مُنَاسِبًا.","El estudiante encontró alojamiento adecuado."],["هَلِ السَّكَنُ مُتَاحٌ بِالْقُرْبِ مِنَ الْجَامِعَةِ؟","¿Hay alojamiento cerca de la universidad?"]]},{"ar":"اِحْتِيَاجٌ","es":"Necesidad","examples":[["الطَّعَامُ مِنَ الِاحْتِيَاجَاتِ الْأَسَاسِيَّةِ.","La comida es una necesidad básica."],["لِكُلِّ طِفْلٍ اِحْتِيَاجَاتٌ مُخْتَلِفَةٌ.","Cada niño tiene necesidades diferentes."],["فَهِمْنَا اِحْتِيَاجَ الْأُسْرَةِ إِلَى الْمُسَاعَدَةِ.","Entendimos que la familia necesitaba ayuda."],["هَلْ هُنَاكَ اِحْتِيَاجٌ إِلَى مَزِيدٍ مِنَ الْوَقْتِ؟","¿Hace falta más tiempo?"]]},{"ar":"مَصَارِيفُ","es":"Gastos","examples":[["أَدْفَعُ مَصَارِيفَ الْبَيْتِ كُلَّ شَهْرٍ.","Pago los gastos de la casa cada mes."],["زَادَتِ الْمَصَارِيفُ هَذَا الْأُسْبُوعَ.","Los gastos aumentaron esta semana."],["كَيْفَ نُنَظِّمُ مَصَارِيفَ السَّفَرِ؟","¿Cómo organizamos los gastos del viaje?"],["كَتَبْتُ مَصَارِيفِي فِي دَفْتَرٍ.","Anoté mis gastos en un cuaderno."]]}]},{"title":"Hogar y futuro","kind":"noun","items":[{"ar":"فَاتُورَةٌ","es":"Factura; recibo","examples":[["دَفَعْتُ فَاتُورَةَ الْكَهْرَبَاءِ.","Pagué la factura de la luz."],["وَصَلَتْ فَاتُورَةُ الْمَاءِ الْيَوْمَ.","Hoy llegó la factura del agua."],["هَلْ رَاجَعْتَ الْفَوَاتِيرَ؟","¿Has revisado las facturas?"],["أَحْفَظُ نُسْخَةً مِنْ كُلِّ فَاتُورَةٍ.","Guardo una copia de cada factura."]]},{"ar":"خُطَّةٌ","es":"Plan","examples":[["لَدَيَّ خُطَّةٌ لِدِرَاسَةِ الْعَرَبِيَّةِ.","Tengo un plan para estudiar árabe."],["غَيَّرْنَا الْخُطَّةَ بَعْدَ الْحَدِيثِ.","Cambiamos el plan después de hablar."],["هَلْ خُطَّتُكَ وَاضِحَةٌ لِلْجَمِيعِ؟","¿Tu plan está claro para todos?"],["تَحْتَاجُ الْأُسْرَةُ إِلَى خُطَّةٍ لِلْمَصَارِيفِ.","La familia necesita un plan de gastos."]]},{"ar":"مُرُونَةٌ","es":"Flexibilidad","examples":[["يُعْطِينِي عَمَلِي مُرُونَةً فِي الْوَقْتِ.","Mi trabajo me da flexibilidad horaria."],["نَحْتَاجُ إِلَى مُرُونَةٍ عِنْدَ تَغْيِيرِ الْخُطَّةِ.","Necesitamos flexibilidad al cambiar el plan."],["أَعْجَبَتْنِي مُرُونَةُ الْمُعَلِّمِ.","Me gustó la flexibilidad del profesor."],["قِلَّةُ الْمُرُونَةِ تُصَعِّبُ التَّعَاوُنَ.","La falta de flexibilidad dificulta la cooperación."]]},{"ar":"سَبِيلٌ","es":"Camino; manera","examples":[["أَبْحَثُ عَنْ سَبِيلٍ لِلْمُسَاعَدَةِ.","Busco una manera de ayudar."],["هَذَا سَبِيلٌ جَيِّدٌ لِلتَّعَلُّمِ.","Este es un buen camino para aprender."],["لَا أَرَى سَبِيلًا آخَرَ الْآنَ.","No veo otra manera por ahora."],["هَلْ هُنَاكَ سَبِيلٌ إِلَى حَلِّ الْمُشْكِلَةِ؟","¿Hay alguna forma de resolver el problema?"]]},{"ar":"رِعَايَةٌ","es":"Cuidado; atención","examples":[["يَحْتَاجُ الْمَرِيضُ إِلَى رِعَايَةٍ جَيِّدَةٍ.","El enfermo necesita buenos cuidados."],["تَحْتَاجُ رِعَايَةُ الْأَطْفَالِ إِلَى صَبْرٍ.","Cuidar a los niños requiere paciencia."],["شَكَرْتُ أُمِّي عَلَى رِعَايَتِهَا لِي.","Agradecí a mi madre sus cuidados."],["تُقَدِّمُ الْمَدْرَسَةُ رِعَايَةً لِلطُّلَّابِ الصِّغَارِ.","La escuela ofrece atención a los alumnos pequeños."]]},{"ar":"مَوَدَّةٌ","es":"Afecto; cariño","examples":[["بَيْنَ أَفْرَادِ الْأُسْرَةِ مَوَدَّةٌ وَرَحْمَةٌ.","Entre los miembros de la familia hay afecto y misericordia."],["تَزْدَادُ الْمَوَدَّةُ بِحُسْنِ الْمُعَامَلَةِ.","El cariño crece con el buen trato."],["أَظْهَرَ مَوَدَّتَهُ لِصَدِيقِهِ.","Mostró cariño a su amigo."],["نَتَحَدَّثُ بِمَوَدَّةٍ حَتَّى عِنْدَ الِاخْتِلَافِ.","Hablamos con afecto incluso cuando discrepamos."]]},{"ar":"رَحْمَةٌ","es":"Misericordia; compasión","examples":[["نَسْأَلُ اللهَ الرَّحْمَةَ.","Pedimos misericordia a Allah."],["عَامَلَ الطِّفْلَ بِرَحْمَةٍ.","Trató al niño con compasión."],["الرَّحْمَةُ مُهِمَّةٌ فِي الْأُسْرَةِ.","La misericordia es importante en la familia."],["تَظْهَرُ رَحْمَتُهَا فِي رِعَايَةِ الْمَرْضَى.","Su compasión se ve en el cuidado de los enfermos."]]},{"ar":"سَكِينَةٌ","es":"Sosiego; serenidad","examples":[["أَجِدُ السَّكِينَةَ فِي الصَّلَاةِ.","Encuentro sosiego en la oración."],["يَمْلَأُ الْبَيْتَ شُعُورٌ بِالسَّكِينَةِ.","Una sensación de serenidad llena la casa."],["نَحْتَاجُ إِلَى السَّكِينَةِ بَعْدَ يَوْمٍ طَوِيلٍ.","Necesitamos tranquilidad después de un día largo."],["كَانَ صَوْتُهُ مَصْدَرَ سَكِينَةٍ لَهَا.","Su voz fue una fuente de calma para ella."]]},{"ar":"أَوْلَوِيَّةٌ","es":"Prioridad","examples":[["صِحَّةُ الْأُسْرَةِ أَوْلَوِيَّةٌ عِنْدِي.","La salud de la familia es una prioridad para mí."],["حَدَّدْنَا أَوْلَوِيَّاتِنَا لِهَذَا الْعَامِ.","Definimos nuestras prioridades para este año."],["مَا أَوْلَوِيَّتُكَ الْأُولَى فِي خُطَّتِكَ؟","¿Cuál es la primera prioridad de tu plan?"],["أُقَدِّمُ دِرَاسَتِي عَلَى أُمُورٍ أَقَلَّ أَوْلَوِيَّةً.","Pongo mis estudios por delante de asuntos menos prioritarios."]]},{"ar":"هَدَفٌ","es":"Objetivo; meta","examples":[["هَدَفِي أَنْ أَتَحَدَّثَ بِالْعَرَبِيَّةِ.","Mi objetivo es hablar en árabe."],["حَقَّقْنَا هَدَفًا صَغِيرًا هَذَا الْأُسْبُوعَ.","Alcanzamos una pequeña meta esta semana."],["مَا أَهْدَافُكَ لِلْعَامِ الْقَادِمِ؟","¿Cuáles son tus objetivos para el próximo año?"],["يَحْتَاجُ كُلُّ هَدَفٍ إِلَى صَبْرٍ وَخُطَّةٍ.","Cada objetivo requiere paciencia y un plan."]]}]}]);
    groups.flatMap(group => group.items).forEach((item, index) => { item.number = index + 1; });
    const content = document.getElementById('content');
    const escapeHtml = s => s.replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    let filter = 'all';
    let search = '';
    const normalize = s => s.normalize('NFD').replace(/[\u064b-\u065f\u0670]/g, '').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    function render() {
      const shown = groups.filter(group => filter === 'all' || group.kind === filter).map(group => ({...group, items: group.items.filter(item => normalize(item.ar + ' ' + item.es).includes(search))})).filter(group => group.items.length);
      content.innerHTML = shown.map(group => `
        <section class="group"><div class="group-head"><h2>${escapeHtml(group.title)}</h2><span>${group.items.length} palabras</span></div>
        <div class="grid">${group.items.map(item => `<article class="card">
          <div class="card-top"><div class="word"><p class="number">PALABRA ${String(item.number).padStart(2,'0')}</p><h3 class="term arabic" lang="ar" dir="rtl">${escapeHtml(item.ar)}</h3></div><span class="meaning" lang="es">${escapeHtml(item.es)}</span></div>
          <ol class="examples">${item.examples.map(([ar,es]) => `<li><p class="example-ar arabic" lang="ar" dir="rtl">${escapeHtml(ar)}</p><p class="example-es" lang="es" dir="ltr">${escapeHtml(es)}</p></li>`).join('')}</ol>
        </article>`).join('')}</div></section>`).join('') || '<p class="empty">No hay palabras con esa búsqueda.</p>';
    }
    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
      filter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
      render();
    }));
    document.getElementById('search').addEventListener('input', e => { search = normalize(e.target.value.trim()); render(); });
    document.getElementById('study').addEventListener('click', e => {
      const active = document.body.classList.toggle('hidden-translation');
      e.currentTarget.setAttribute('aria-pressed', String(active));
      e.currentTarget.textContent = active ? 'Mostrar traducciones' : 'Ocultar traducciones';
    });
    render();
  </script>
</body>
</html>
